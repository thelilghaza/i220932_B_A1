name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  release-pipeline:
    name: Release Pipeline (Test, Build & Publish to GHCR)
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependency Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v tests/test_app.py

      - name: Extract Semantic Version and Metadata
        id: meta
        run: |
          # Strip leading 'v' from Git tag dynamically (e.g. v1.0.0 -> 1.0.0)
          RAW_TAG="${GITHUB_REF_NAME}"
          VERSION="${RAW_TAG#v}"
          COMMIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/student-ml-api"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

          echo "Derived Version: ${VERSION}"
          echo "Derived Commit SHA: ${COMMIT_SHA}"
          echo "Target Image Name: ${IMAGE_NAME}"

      - name: Authenticate to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT_SHA="${COMMIT_SHA}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${BUILD_DATE}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${COMMIT_SHA}" \
            .

          echo "Pushing tag ${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION}"

          echo "Pushing tag ${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

          echo "Pushing tag ${IMAGE_NAME}:${COMMIT_SHA}"
          docker push "${IMAGE_NAME}:${COMMIT_SHA}"
